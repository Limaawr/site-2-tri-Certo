
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            header{
                background-color: #ad8b4b;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
            }
            main{
                background-color: darkblue;
                color:#ffff;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
            }
            img{
                width: 80px;
                height: 80px;
            }
            .artigo-autor{
                font-weight:bold;
            }

        </style>
    </head>
    <body>
        <header>    
            <h1>Mundo do Futsal</h1>
            <p>Bem-vindo ao Mundo do Futsal, um site de notícias e venda de tênis para futsal.</p>
        </header>
        <main>
            <img src="copa.png" alt="Ícone quadrado com fundo azul e detalhes em verde e amarelo. À esquerda, um desenho estilizado em dourado da taça da Copa do Mundo. À direita, a ilustração de dois jogadores de futebol em um aperto de mão. Abaixo, o texto: Copa e Transferências">
            <div>
                <h2>Copa do Mundo e transferências 2026</h2>
                <p class="artigo-autor">Por: Nicolas</p>
                <p>Bem-vindo a nossa página de notícias sobre lesões, resultado de jogos, escalações do futebol mundial</p>
                <button>❤️ <span>0</span></button>
            </div>
         </main>

</body>
<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado);

 function botaoClicado(){
    console.log("fui clicado");
    let texto = botao.querySelector("span");
    texto.textContent++;
 }

</script>
</html>
